events { worker_connections 1024; }

http {
    server {
        listen 80;

        # Route /api/transactions/<userId> directly to the JS transactions microservice
        location ~ ^/api/transactions/.+ {
            proxy_pass http://transactions:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route /api/... (including session-based /api/transactions) to the Python Flask backend
        location /api/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route everything else to the frontend (studentportfolio)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}